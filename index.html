<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual" />
  <title>BBVA</title>

  <!-- Modo app en el móvil. Barra de estado "default": iOS 26 la pinta con theme-color (liso y nítido).
       Con "black-translucent" iOS 26 desenfoca y oscurece la foto bajo la hora y no hay forma de evitarlo. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BBVA" />
  <meta name="theme-color" content="#144866" />
  <link rel="manifest" href="manifest.json?v=27" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Libre+Franklin:wght@300;400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css?v=27" />
</head>
<body>
  <!-- Tira lisa arriba: iOS 26 solo deja de desenfocar si el borde superior de la página es de color liso -->
  <div class="edge"></div>

  <!-- Foto real a pantalla completa (logo BBVA, Ayuda y Menú vienen en la imagen) -->
  <div class="stage">
    <section class="card">
      <h1 class="greeting">Buenas tardes,<br />Carlos</h1>
      <div class="avatar">CC</div>

      <a href="#" class="switch-user">Cambiar usuario</a>

      <button class="login-btn" type="button">Iniciar sesión</button>

      <svg class="lock" viewBox="0 0 24 31" aria-hidden="true">
        <rect x="1.3" y="12.3" width="21.4" height="17.4" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M5.5 12.3V8.2a6.5 6.5 0 0 1 13 0v4.1" fill="none" stroke="currentColor" stroke-width="2.4"/>
      </svg>
      <p class="notice">BBVA NUNCA te pedirá tus datos mediante SMS con<br />enlaces NI en llamadas telefónicas</p>
    </section>
  </div>

  <!-- Panel "Iniciar sesión" (sube desde abajo). Usa la foto real como plantilla. -->
  <div class="sheet-overlay" id="sheet" aria-hidden="true">
    <div class="sheet-dim" id="sheetDim"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Iniciar sesión">
      <img class="sheet-img" src="sheet-bg.jpg?v=27" alt="" draggable="false" />

      <!-- Campo vivo (encima del de la foto): etiqueta flotante + puntos -->
      <div class="field2" id="field2">
        <span class="field2__label" id="fLabel">Clave de acceso</span>
        <div class="field2__dots" id="dots"></div>
        <input class="field2__input" id="pwd" type="text" inputmode="text"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               aria-label="Clave de acceso" />
        <button class="field2__eye" id="eye" type="button" aria-label="Mostrar clave">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
        </button>
      </div>

      <!-- Botón blanco que aparece encima del gris al escribir -->
      <button class="btn-white" id="sheetLogin" type="button">Iniciar sesión</button>

      <!-- Zonas táctiles sobre la plantilla -->
      <button class="hit hit-close" id="sheetClose" type="button" aria-label="Cerrar"></button>
      <a class="hit hit-forgot" id="forgot" href="#" aria-label="¿Has olvidado tu clave de acceso?"></a>
    </section>
  </div>

  <!-- Pantalla de dentro (home), aparece al iniciar sesión -->
  <div class="home" id="home" aria-hidden="true">
    <button class="home-vertodo" id="homeVerTodo" type="button" aria-label="Ver todo"></button>
  </div>

  <!-- Pantalla "Principales productos": tarjetas de cuenta deslizables -->
  <div class="ver" id="ver" aria-hidden="true">
    <div class="ver-track" id="verTrack">
      <section class="ver-card" style="background-image:url('card1.jpg?v=27')"></section>
      <section class="ver-card" style="background-image:url('card2.jpg?v=27')"></section>
    </div>
    <div class="ver-pager" id="verPager">1 de 5</div>
  </div>

  <script>
    // En modo app (pantalla de inicio) ocupar la pantalla entera, también bajo la barra de estado
    (function () {
      var stage = document.querySelector('.stage');
      // Modo app nativa: ?app=1  (foto limpia a pantalla completa, sin desplazamientos)
      var appMode = new URLSearchParams(location.search).get('app') === '1';
      if (appMode) document.documentElement.classList.add('app');
      var standalone = !appMode && (window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches);
      // Alto de la zona de la hora que iOS reserva sobre la página (0 si la barra es opaca)
      var probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;top:0;left:0;height:0;visibility:hidden;padding-top:env(safe-area-inset-top)';
      document.body.appendChild(probe);

      function fit() {
        var w = window.innerWidth;
        var inset = parseFloat(getComputedStyle(probe).paddingTop) || 0;
        var full = standalone ? Math.max(screen.height, window.innerHeight) : window.innerHeight;
        // Barra opaca ("default"): la página empieza debajo de la hora -> subir la foto esa altura.
        // Barra transparente (icono antiguo): la página ya empieza arriba del todo -> no desplazar.
        var off = (standalone && inset === 0) ? Math.max(0, full - window.innerHeight) : 0;
        stage.style.top = -off + 'px';
        stage.style.height = full + 'px';
        document.documentElement.style.backgroundSize = w + 'px ' + full + 'px';
        document.documentElement.style.backgroundPosition = '0 ' + (-off) + 'px';
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      // Mantener la página pegada arriba cuando el teclado abre/cierra (que no se mueva)
      if (window.visualViewport) {
        var pin = function () { window.scrollTo(0, 0); };
        window.visualViewport.addEventListener('resize', pin);
        window.visualViewport.addEventListener('scroll', pin);
      }
      // Que no se mueva la pantalla al arrastrar (pero sí en campos de texto y en el carrusel de cuentas)
      document.addEventListener('touchmove', function (e) {
        if (!e.target.closest('input, textarea, .ver-track')) e.preventDefault();
      }, { passive: false });

      // ---- Panel "Iniciar sesión" ----
      var sheet = document.getElementById('sheet');
      var pwd = document.getElementById('pwd');
      var dots = document.getElementById('dots');
      var field2 = document.getElementById('field2');
      var loginBtn = document.getElementById('sheetLogin');
      var openBtn = document.querySelector('.login-btn');
      var revealed = false;

      function floatLabel() {
        // la etiqueta sube (pequeña) si hay foco o texto
        var focused = document.activeElement === pwd;
        var up = focused || pwd.value.length > 0;
        field2.classList.toggle('floated', up);
        field2.classList.toggle('focused', focused);
      }

      function render() {
        var v = pwd.value;
        dots.innerHTML = '';
        if (revealed && v.length) {
          dots.classList.add('as-text');
          var sp = document.createElement('span');
          sp.textContent = v;
          dots.appendChild(sp);
        } else {
          dots.classList.remove('as-text');
          for (var i = 0; i < v.length; i++) {
            dots.appendChild(document.createElement('i'));
          }
        }
        // cursor propio (siempre tras el último punto, centrado)
        dots.appendChild(document.createElement('b'));
        var focused = document.activeElement === pwd;
        dots.style.display = (focused || v.length) ? 'flex' : 'none';
        loginBtn.classList.toggle('on', v.length >= 4);  // blanco con más de 4
        floatLabel();
      }

      function openSheet() {
        sheet.classList.add('open');
        sheet.setAttribute('aria-hidden', 'false');
        document.body.classList.add('sheet-open');
        // Abrir el teclado YA, dentro del gesto (si se retrasa, iOS no lo abre)
        try { pwd.focus({ preventScroll: true }); } catch (e) { pwd.focus(); }
        render();
        setTimeout(function () { window.scrollTo(0, 0); }, 50);
      }
      function closeSheet() {
        pwd.blur();
        sheet.classList.remove('open');
        sheet.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('sheet-open');
      }

      openBtn.addEventListener('click', openSheet);
      document.getElementById('sheetClose').addEventListener('click', closeSheet);
      document.getElementById('sheetDim').addEventListener('click', closeSheet);

      // Iniciar sesión (botón blanco) -> pantalla de dentro
      var home = document.getElementById('home');
      loginBtn.addEventListener('click', function () {
        if (!loginBtn.classList.contains('on')) return;
        pwd.blur();
        home.classList.add('open');
        home.setAttribute('aria-hidden', 'false');
        closeSheet();
      });

      // Ver todo -> pantalla de cuentas (solo la tarjeta se desliza)
      var ver = document.getElementById('ver');
      var verTrack = document.getElementById('verTrack');
      var verPager = document.getElementById('verPager');
      var verCards = verTrack.querySelectorAll('.ver-card');

      function updatePager() {
        var pitch = verCards.length > 1
          ? (verCards[1].offsetLeft - verCards[0].offsetLeft)
          : verTrack.clientWidth;
        var i = pitch ? Math.round(verTrack.scrollLeft / pitch) : 0;
        if (i < 0) i = 0;
        verPager.textContent = (i + 1) + ' de 5';
      }
      verTrack.addEventListener('scroll', updatePager, { passive: true });

      document.getElementById('homeVerTodo').addEventListener('click', function () {
        ver.classList.add('open');
        ver.setAttribute('aria-hidden', 'false');
        verTrack.scrollLeft = 0;
        updatePager();
      });

      pwd.addEventListener('input', render);
      // Etiqueta flotante y cursor al enfocar / desenfocar
      pwd.addEventListener('focus', function () {
        render();
        setTimeout(function () { window.scrollTo(0, 0); }, 50);
      });
      pwd.addEventListener('blur', render);

      // Ojo: mostrar/ocultar la clave (por defecto siempre puntos)
      document.getElementById('eye').addEventListener('click', function () {
        revealed = !revealed;
        render();
        pwd.focus({ preventScroll: true });
      });

      // Enlaces sin acción por ahora
      document.getElementById('forgot').addEventListener('click', function (e) { e.preventDefault(); });
      var cambiar = document.querySelector('.switch-user');
      if (cambiar) cambiar.addEventListener('click', function (e) { e.preventDefault(); });
    })();
  </script>
</body>
</html>
