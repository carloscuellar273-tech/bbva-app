<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>BBVA</title>

  <!-- Modo app en el móvil (pantalla completa, barra de estado transparente) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BBVA" />
  <meta name="theme-color" content="#022d5a" />
  <link rel="manifest" href="manifest.json?v=6" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <!-- Foto real a pantalla completa (logo BBVA, Ayuda y Menú vienen en la imagen) -->
  <div class="stage">
    <section class="card">
      <h1 class="greeting">Buenas tardes,<br />Carlos</h1>
      <div class="avatar">CC</div>

      <a href="#" class="switch-user">Cambiar usuario</a>

      <button class="login-btn" type="button">Iniciar sesión</button>

      <svg class="lock" viewBox="0 0 24 31" aria-hidden="true">
        <rect x="1.3" y="12.3" width="21.4" height="17.4" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M5.5 12.3V8.2a6.5 6.5 0 0 1 13 0v4.1" fill="none" stroke="currentColor" stroke-width="2.4"/>
      </svg>
      <p class="notice">BBVA NUNCA te pedirá tus datos mediante SMS con<br />enlaces NI en llamadas telefónicas</p>
    </section>
  </div>

  <!-- DIAGNÓSTICO TEMPORAL (se quitará) -->
  <div id="dbg" style="position:fixed;left:0;right:0;top:88%;text-align:center;font:12px -apple-system,sans-serif;color:#fff;opacity:.85;pointer-events:none"></div>

  <script>
    // En modo app (pantalla de inicio) ocupar la pantalla entera, también bajo la barra de estado
    (function () {
      var stage = document.querySelector('.stage');
      var standalone = window.navigator.standalone === true ||
        window.matchMedia('(display-mode: standalone)').matches;
      function fit() {
        var w = window.innerWidth;
        var h = standalone ? Math.max(screen.height, window.innerHeight) : window.innerHeight;
        stage.style.height = h + 'px';
        document.documentElement.style.backgroundSize = w + 'px ' + h + 'px';
        var d = document.getElementById('dbg');
        if (d) d.textContent = 'v6 · app:' + (standalone ? 'sí' : 'no') + ' · ventana ' + window.innerWidth + 'x' + window.innerHeight +
          ' · pantalla ' + screen.width + 'x' + screen.height + ' · html ' + document.documentElement.clientHeight;
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      // Que no se mueva la pantalla al arrastrar
      document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
</html>
